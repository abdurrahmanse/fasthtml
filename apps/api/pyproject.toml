[project]
name = "portfolio-api"
version = "0.1.0"
description = "FastAPI backend for the portfolio monorepo"
requires-python = ">=3.9"
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
